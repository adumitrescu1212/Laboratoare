<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<title>Pagina principală</title>
<style>
    /* Exercițiul 6: Stiluri pentru meniul principal (butoane uniforme) */
    ul.meniu-principal {
        list-style-type: none; /* elimină bulinele */
        padding: 0;
    }
    ul.meniu-principal li {
        margin-bottom: 12px; /* spațiu vertical între butoane */
    }
    ul.meniu-principal li a {
        text-decoration: none;
        color: white;
        background-color: #2c3e50; /* Culoare uniformă (albastru închis) */
        padding: 12px 20px;
        border-radius: 5px;
        display: inline-block;
        width: 280px; /* Lățime uniformă pentru toate butoanele */
        text-align: center;
        font-family: Arial, sans-serif;
        transition: background-color 0.3s; /* tranziție lină pentru hover */
    }
    /* Efect de schimbare a culorii la trecerea cu mouse-ul */
    ul.meniu-principal li a:hover {
        background-color: #e67e22; /* portocaliu la hover */
    }
</style>
</head>
