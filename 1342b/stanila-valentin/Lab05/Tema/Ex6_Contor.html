<!DOCTYPE html>
<html>
<head>
<title>Exercitiu bonus - Contor</title>
<script>
var contor = 0;

function schimbaStarea() {
    var bec = document.getElementById("bec");
    var paragraf = document.getElementById("mesaj");

    if (bec.src.includes("stins")) {
        bec.src = "Bec aprins.gif";
        contor++;
        paragraf.innerHTML = "Becul a fost aprins de " + contor + " ori.";
    } else {
        bec.src = "Bec stins.gif";
    }
}
</script>
</head>
<body>

<h1>Bec cu contor</h1>

<img id="bec" src="Bec stins.gif" width="100" height="180" onclick="schimbaStarea()">

<p id="mesaj">Becul a fost aprins de 0 ori.</p>

</body>
</html>
