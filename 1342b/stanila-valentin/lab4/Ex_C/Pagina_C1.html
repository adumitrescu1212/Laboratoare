<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS_C1</title>
<style>
    #hd {
        font-variant: small-caps;
        color: rgb(224, 56, 210);
    }
    body {
        background-color: #ffffcc;
    }
    .center, p {
        text-align: center;
        color: red;
    }
    h1 {
        background-color: #cccc00;
    }
    
    table, th, td {
        border: 2px solid green;
        border-collapse: collapse;
        padding: 15px;
    }
    
    caption {
        color: white;
        background-color: orange;
        font-size: 24px;
        font-weight: bold;
        padding: 10px;
    }

    th {
        background-color: magenta;
    }

    td {
        background-color: orange;
    }

    .echipa {
        background-color: magenta;
        font-weight: bold;
        text-align: center;
    }
</style>
</head>
<body>

<h1 id="hd" class="center">Tabel special</h1>
<p>Un tabel cu "celule lipite"</p> 

<table style="width:100%">
<caption>Echipe si hobby-uri</caption>
  <tr>
    <th>Echipa</th>
    <th>Nume</th>
    <th colspan="2">Pasiuni</th>
  </tr>
  

  <tr>
    <td rowspan="3" class="echipa">Munte</td>
    <td>Popescu</td>
    <td>calatorii</td>
    <td>filatelie</td>
  </tr>
  <tr>
    <td>Ionescu</td>
    <td>planorism</td>
    <td>sah</td>
  </tr>
  <tr>
    <td>Vasilescu</td>
    <td>alpinism</td>
    <td>schi</td>
  </tr>

  <tr>
    <td rowspan="4" class="echipa">Mare</td>
    <td>Georgescu</td>
    <td>plaja</td>
    <td>dans</td>
  </tr>
  <tr>
    <td>Gigescu</td>
    <td>surf</td>
    <td>samba</td>
  </tr>
  <tr>
    <td>Mintescu</td>
    <td>politica</td>
    <td>delicateturi</td>
  </tr>
  <tr>
    <td>Marinescu</td>
    <td>inot</td>
    <td>scufundari</td>
  </tr>
</table>

</body>
</html>
