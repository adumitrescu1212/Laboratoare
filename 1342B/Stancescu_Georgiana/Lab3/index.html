  <style>
    ul.butoane {
      list-style-type: none;
      padding: 0;
      margin: 20px 0;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    ul.butoane li a {
      display: inline-block;
      text-decoration: none;
      color: white;
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: bold;
      font-family: Arial, sans-serif;
      transition: opacity 0.2s ease-in-out;
    }

    ul.butoane li a:hover {
      opacity: 0.85;
    }

    .btn-indicatii { background-color: #6c757d; }
    .btn-inline    { background-color: #28a745; }
    .btn-internal  { background-color: #17a2b8; }
    .btn-external  { background-color: #fd7e14; }
    .btn-back      { background-color: #343a40; }
  </style>
</head>
