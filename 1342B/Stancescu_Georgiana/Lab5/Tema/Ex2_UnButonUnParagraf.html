<!DOCTYPE html>
<html>
<head>
<title>Modificari cu JavaScript in tag</title>

</head>
<body>

<h1>Modificari paragraf la click pe buton</h1>

<p id="p1">Paragraf de modificat</p>

<button onclick="var p = document.getElementById('p1'); p.style.backgroundColor = 'pink'; p.style.color = 'red';">Click!</button>

</body>
</html>
