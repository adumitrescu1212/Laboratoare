<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS_B1</title>
<style>
    body {
    background-color: #ffffcc;
    }
.center {
  text-align: center;
  color: white;
}
    h1 {
        background-color: #00cc66;
        color: orange;
    }
table, th, td {
  border: 1px solid black;
  border-collapse: collapse;
}
.centre {
border: 5px solid blue;
 padding: 15px;
}
.centre th, .centre td {
border: 5px solid blue;
 padding: 15px;
}
#s1 {
background-color: #0000cc;
}
#s2 {
background-color: yellow;
}
div {
color:blue;
}
</style>
</head>
<body>

<h1 class="center">Tabele formatate</h1>
<div id="s1">
<table style="width:100%" class="center">
  <tr>
    <th>Firstname</th>
    <th>Lastname</th>
    <th>Age</th>
  </tr>
  <tr>
    <td>Jill</td>
    <td>Smith</td>
    <td>50</td>
  </tr>
  <tr>
    <td>Eve</td>
    <td>Jackson</td>
    <td>94</td>
  </tr>
</table>
<br>
</div> 
<div id="s2" style="width:50%">
<br>
<table style="width:100%" class="centre">
  <tr>
    <th class="centre">Firstname</th>
    <th class="centre">Lastname</th>
    <th class="centre">Age</th>
  </tr>
  <tr>
    <td class="centre">Jill</td>
    <td>Smith</td>
    <td>50</td>
  </tr>
  <tr>
    <td class="centre">Eve</td>
    <td>Jackson</td>
    <td>94</td>
  </tr>
</table>
</div> 

</body>
</html>

<!--Cele doua tabele au fundaluri diferite deoarece nu au fundal propriu
, deci sunt transparente si se vede div-ul in care se afla: 
albastru din s1 (<div id="s1">) la primul tabel
si yellow din s2 (<div id="s2">) la al doilea.

In al doilea tabel celulele arata diferit pentru ca doar unele au
class="centre", care bate regula table, th, td (clasa bate tag-ul) si le da
chenar albastru de 5px si padding 15px. Celelalte au doar chenar negru de 1px
si fara padding.-->
