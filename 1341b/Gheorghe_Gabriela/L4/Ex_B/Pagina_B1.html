<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS_B1</title>
<style>
    body {
    background-color: #ffffcc;
    }
.center {
  text-align: center;
  color: white;
}
    h1 {
        background-color: #00cc66;
        color: orange;
    }
table, th, td {
  text-align: center;
  border: 5px solid blue;
  border-collapse: collapse;
}
.centre {
border: 5px solid blue;
 padding: 15px;
}
#s1 {
background-color: #0044ff;
}
#s2 {
background-color: yellow;
}
div {
color:blue;
}
</style>
</head>
<body>

<h1 class="center">Tabele formatate</h1>
<div id="s1">
<table style="width:100%" class="center">
  <tr>
    <th>Firstname</th>
    <th>Lastname</th>
    <th>Age</th>
  </tr>
  <tr>
    <td>Jill</td>
    <td>Smith</td>
    <td>50</td>
  </tr>
  <tr>
    <td>Eve</td>
    <td>Jackson</td>
    <td>94</td>
  </tr>
</table>
<br>
</div> 
<div id="s2" style="width:50%">
<br>
<table style="width:100%" class="centre">
  <tr>
    <th class="centre">Firstname</th>
    <th class="centre">Lastname</th>
    <th class="centre">Age</th>
  </tr>
  <tr>
    <td class="centre">Jill</td>
    <td>Smith</td>
    <td>50</td>
  </tr>
  <tr>
    <td class="centre">Eve</td>
    <td>Jackson</td>
    <td>94</td>
  </tr>
</table>
</div> 
</body>
</html>
<!--
  - Cele două tabele au fundaluri diferite deoarece ID-ul are prioritate față de selectori de clase și taguri.
  - În al doilea tabel, fiecare element avea clasa „center”, care modifica aspectul celulelor.
  - Clasa „center” a fost aplicată celui de-al doilea tabel pentru a alinia textul și a-i schimba culoarea în alb.
-->
