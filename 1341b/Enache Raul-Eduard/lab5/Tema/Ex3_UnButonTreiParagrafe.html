<!DOCTYPE html>
<html>
<head>
<title>Modificari paragrafe</title>
    <script>
        function change() {
            var a = document.getElementById("p1");
            var b = document.getElementById("p2");
            var c = document.getElementById("p3");

            a.style.color = "red";
            b.style.color = "green";
            c.style.color = "blue";

            a.style.backgroundColor = "green";
            b.style.backgroundColor = "purple";
            c.style.backgroundColor = "yellow";

            a.innerHTML = "Acesta este paragraful 1";
            b.innerHTML = "Acesta este paragraful 2";
            c.innerHTML = "Acesta este paragraful 3";
        }
    </script>
</head>
<body>

<h1>Modificari paragrafe la click pe buton</h1>

<p id="p1">Acesta este un paragraf</p>

<p id="p2">Si acesta este un paragraf</p>

<p id="p3">Acesta este inca un paragraf</p>

<button type="button" onclick="change()" >Apasa-ma!</button>

</body>
</html>
