<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Exercițiul 6 - Contor Bec</title>
    <script>
        
        let numarAprinderi = 0;

        function schimbaStareaBecului() {
            let bec = document.getElementById("bec");
            let paragrafContor = document.getElementById("contor");

            console.log(bec.src);

            if (bec.src.includes("Bec%20stins.gif") || bec.src.includes("Bec stins.gif")) {
                bec.src = "Bec aprins.gif";
                
                numarAprinderi++;
                
                paragrafContor.innerText = "Becul a fost aprins de " + numarAprinderi + " ori.";
            } else {
                bec.src = "Bec stins.gif";
            }
        }
    </script>
</head>
<body>

    <h1>Control Bec cu Contor</h1>

    <p>
        <img id="bec" src="Bec stins.gif" width="100" height="180" onclick="schimbaStareaBecului()" style="cursor: pointer;">
    </p>

    <p id="contor">Becul a fost aprins de 0 ori.</p>

</body>
</html>
