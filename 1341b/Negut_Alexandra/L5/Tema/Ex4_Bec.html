<!DOCTYPE html>
<html>
<head>
<title> Bec </title>
<script>
function changeImage() {
    var image = document.getElementById('bec');
    if (image.src.match("aprins")) {
        image.src = "Bec stins.gif";
    } else {
        image.src = "Bec aprins.gif";
    }
}
</script>
</head>
<body>

<h1>Bec stins</h1>



<p>


<img  id="bec" onmouseover="changeImage()" onmouseout="changeImage()" src="Bec stins.gif" width="100" height="180">

</p>




</body>
</html>
