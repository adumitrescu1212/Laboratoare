<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS_C1</title>
<style>
    #hd {
        font-variant: small-caps;
        color: magenta;
    }
    /* S-a păstrat stilul pentru h1 fără a afecta caption */
    h1 {
        color: blue;
        background-color: #cccc00;
    }
    body {
        background-color: #ffffcc;
    }
    .center, p {
        text-align: center;
        color: red;
    }

    /* Exercițiul 6: Formatare tabel conform cerinței */
    table {
        border-collapse: collapse;
        border: 2px solid green;
    }

    /* Chenare verzi și spațiu generos pentru toate celulele */
    th, td {
        border: 2px solid green;
        padding: 12px;
    }

    /* Titlu (caption): alb, mare, pe fond portocaliu */
    caption {
        color: white;
        background-color: orange;
        font-size: 24px;
        padding: 8px;
    }

    /* Antet pe fond magenta */
    th {
        background-color: magenta;
    }

    /* Celule de conținut: fond portocaliu */
    td {
        background-color: orange;
    }

    /* Celulele cu numele echipelor: fond magenta, îngroșate și centrate */
    .echipa {
        background-color: magenta;
        font-weight: bold;
        text-align: center;
    }
</style>
</head>
<body>

<h1 id="hd">Tabel special</h1>
<p>Un tabel cu "celule lipite"</p> 

<table style="width:100%">
<caption>Echipe si hobby-uri</caption>
  <tr>
    <th>Echipa</th>
    <th>Nume</th>
    <th colspan="2">Pasiuni</th>
  </tr>

  <!-- Echipa Munte -->
  <tr>
    <td rowspan="3" class="echipa">Munte</td>
    <td>Popescu</td>
    <td>calatorii</td>
    <td>filatelie</td>
  </tr>
  <tr>
    <td>Ionescu</td>
    <td>planorism</td>
    <td>sah</td>
  </tr>
  <tr>
    <td>Radu</td>
    <td>drumetii</td>
    <td>fotografie</td>
  </tr>

  <!-- Echipa Mare -->
  <tr>
    <td rowspan="4" class="echipa">Mare</td>
    <td>Georgescu</td>
    <td>plaja</td>
    <td>dans</td>
  </tr>
  <tr>
    <td>Gigescu</td>
    <td>surf</td>
    <td>samba</td>
  </tr>
  <tr>
    <td>Mintescu</td>
    <td>politica</td>
    <td>delicateturi</td>
  </tr>
  <tr>
    <td>Marinescu</td>
    <td>inot</td>
    <td>scufundari</td>
  </tr>
</table>

</body>
</html>
