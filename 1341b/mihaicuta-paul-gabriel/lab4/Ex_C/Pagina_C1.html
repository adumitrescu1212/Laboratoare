<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS_C1</title>
<style>

        #hd {
        font-variant: small-caps;
        color:magenta;
    }
     h1, caption {
        color: blue;
    background-color: #cccc00;
    }
      body {
    background-color: #ffffcc;
    }
.center, p {
  text-align: center;
  color: red;
}
table {
  border-collapse: collapse;
}
th, td {
  border: 2px solid green;
  padding: 12px;
}
caption {
  color: white;
  background-color: orange;
  font-size: 28px;
}
th {
  background-color: magenta;
}
td {
  background-color: orange;
}
.echipa {
  background-color: magenta;
  font-weight: bold;
  text-align: center;
}

</style>
</head>
<body>

<h1 id="hd">Tabel special</h1>
<p>Un tabel cu "celule lipite"
</p> 
<table style="width:100%">
<caption>Echipe si hobby-uri</caption>
  <tr>
    <th>Echipa</th>
	<th>Nume</th>
    <th colspan="2">Pasiuni</th>
  </tr>
  <tr>
	<td rowspan="3" class="echipa">Munte</td>
    <td>Popescu</td>
    <td>calatorii</td>
    <td>filatelie</td>
  </tr>
  <tr>
	
    <td>Ionescu</td>
    <td>planorism</td>
    <td>sah</td>
  </tr>
  <tr>
    <td>Vasilescu</td>
    <td>ciclism</td>
    <td>fotografie</td>
  </tr>
  <tr>
	<td rowspan="4" class="echipa">Mare</td>
    <td>Georgescu</td>
    <td>plaja</td>
    <td>dans</td>
  </tr>
  <tr>
	
    <td>Gigescu</td>
    <td>surf</td>
    <td>samba</td>
  </tr>
  <tr>
	
    <td>Mintescu</td>
    <td>politica</td>
    <td>delicateturi</td>
  </tr>
  <tr>
    <td>Marinescu</td>
    <td>inot</td>
    <td>pescuit</td>
  </tr>
</table>
</body>
</html>
<!--
Ex. 4: tabelul nu avea chenare, deci celulele pareau "lipite". Am pus border pe th si td,
  border-collapse: collapse pe table (o singura linie intre celule) si padding pentru spatiu.
Ex. 5: am adaugat Vasilescu in echipa Munte si Marinescu in echipa Mare. Ca celulele
  "Munte" si "Mare" sa cuprinda toti membrii, rowspan a crescut: Munte 2 -> 3, Mare 3 -> 4.
  Randurile noi au cu o celula mai putin (fara celula echipei).
Ex. 6: caption alb, mare, pe portocaliu (regula caption e scrisa dupa h1, caption, deci o
  suprascrie, iar h1 ramane neschimbat); antet magenta; celule portocalii; celulele echipelor
  au clasa echipa (magenta, bold, centrat), care bate regula td; chenare verzi contopite.
-->
