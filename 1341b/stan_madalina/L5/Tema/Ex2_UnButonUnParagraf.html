<!DOCTYPE html>
<html>
<head>
<title>Modificari cu JavaScript in tag</title>

</head>
<body>

<h1>Modificari paragraf la click pe buton</h1>

<p id="demo">Paragraf de modificat</p>

<button id="butt" type="button" onclick="var x = document.getElementById('demo');          
x.style.color = 'red'; 
x.style.backgroundColor = 'pink'; 
x.innerHTML = 'Paragraf de modificat!';" >Click!</button>

</body>
</html>
