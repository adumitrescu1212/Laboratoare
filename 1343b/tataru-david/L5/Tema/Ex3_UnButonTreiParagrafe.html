<!DOCTYPE html>
<html>
<head>
<title>ex4</title>
<script>
function modificaParagrafe() {
    var p1 = document.getElementById("p1");
    p1.innerHTML = "Acesta este paragraful 1";
    p1.style.color = "white";
    p1.style.backgroundColor = "blue";

    var p2 = document.getElementById("p2");
    p2.innerHTML = "Acesta este paragraful 2";
    p2.style.color = "blue";
    p2.style.backgroundColor = "yellow";

    var p3 = document.getElementById("p3");
    p3.innerHTML = "Acesta este paragraful 3";
    p3.style.color = "green";
    p3.style.backgroundColor = "pink";
}
</script>
</head>
<body>
<p id="p1">Text initial 1</p>
<p id="p2">Text initial 2</p>
<p id="p3">Text initial 3</p>
<button type="button" onclick="modificaParagrafe()">Aplica modificari</button>
</body>
</html>
