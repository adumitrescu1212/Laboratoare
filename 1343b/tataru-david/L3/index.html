<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<title>Laboratorul 3 - Stiluri CSS</title>
<style>
    /* CSS ex 5: butoane din liste neordonate */
    ul.meniu-butoane {
        list-style-type: none; /* elimin bulinele */
        padding: 0;
    }
    ul.meniu-butoane li {
        display: inline-block; /* afisez butoanele */
        margin-right: 15px;
    }
    ul.meniu-butoane li a {
        text-decoration: none; /* elimin sublinierea */
        color: white;
        padding: 10px 20px;
        border-radius: 8px; /* colturi rotunjite */
        font-family: Arial, sans-serif;
        font-weight: bold;
    }
    /* Culori diferite la alegere */
    ul.meniu-butoane li.btn-1 a { background-color: #e74c3c; } 
    ul.meniu-butoane li.btn-2 a { background-color: #2ecc71; } 
    ul.meniu-butoane li.btn-3 a { background-color: #3498db; } 
</style>
</head>
<body>
    <h1>Laboratorul 3 stiluri CSS</h1>
    <p><a href="FormtareText.html">Indicatii</a></p>
    
    <ul class="meniu-butoane">
        <li class="btn-1"><a href="FormtareText_inline.html">Stiluri inline</a></li>
        <li class="btn-2"><a href="FormtareText_internal.html">Stiluri interne</a></li>
        <li class="btn-3"><a href="FormtareText_external.html">Stiluri externe</a></li>
    </ul>

</body>
</html>
