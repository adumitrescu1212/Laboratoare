
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS_C1</title>

<style>
    #hd {
        font-variant: small-caps;
        color: magenta;
    }

    h1 {
        color: magenta;
        background-color: #cccc00;
    }

    body {
        background-color: #ffffcc;
    }

    p {
        text-align: center;
        color: red;
    }

    table {
        width: 100%;
        border-collapse: collapse;
    }

    table, th, td {
        border: 2px solid green;
    }

    caption {
        color: white;
        background-color: orange;
        font-size: 20px;
        padding: 3px;
    }

    th {
        background-color: magenta;
        color: black;
        text-align: center;
        padding: 12px;
    }

    td {
        background-color: orange;
        padding: 12px;
    }
</style>
</head>

<body>

<h1 id="hd">Tabel special</h1>

<p>Un tabel cu "celule lipite"</p>

<table>
    <caption>Echipe si hobby-uri</caption>

    <tr>
        <th>Echipa</th>
        <th>Nume</th>
        <th colspan="2">Pasiuni</th>
    </tr>

    <tr>
        <th rowspan="3">Munte</th>
        <td>Popescu</td>
        <td>calatorii</td>
        <td>filatelie</td>
    </tr>

    <tr>
        <td>Ionescu</td>
        <td>planorism</td>
        <td>sah</td>
    </tr>

    <!-- Exercitiul 5: membru nou in echipa Munte -->
    <tr>
        <td>Marinescu</td>
        <td>drumetii</td>
        <td>fotografie</td>
    </tr>

    <tr>
        <th rowspan="4">Mare</th>
        <td>Georgescu</td>
        <td>plaja</td>
        <td>dans</td>
    </tr>

    <tr>
        <td>Gigescu</td>
        <td>surf</td>
        <td>samba</td>
    </tr>

    <tr>
        <td>Mintescu</td>
        <td>politica</td>
        <td>delicateturi</td>
    </tr>

    <!-- Exercitiul 5: membru nou in echipa Mare -->
    <tr>
        <td>Marin</td>
        <td>inot</td>
        <td>pescuit</td>
    </tr>

</table>

</body>
</html>
