<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS_C1</title>
<style>

#hd {
    font-variant: small-caps;
    color: magenta;
}

h1 {
    color: blue;
    background-color: #cccc00;
}

body {
    background-color: #ffffcc;
}

.center, p {
    text-align: center;
    color: red;
}

/* Chenarele tabelului */
table, th, td {
    border: 2px solid green;
    border-collapse: collapse;
}

/* Spațiu generos în celule */
th, td {
    padding: 15px;
}

/* Titlul tabelului */
caption {
    color: white;
    background-color: orange;
    font-size: 24px;
}

/* Antetul tabelului */
th {
    background-color: magenta;
}

/* Celulele cu date */
td {
    background-color: orange;
}

/* Numele echipelor */
td[rowspan] {
    background-color: magenta;
    font-weight: bold;
    text-align: center;
}


</style>
</head>
<body>

<h1 id="hd">Tabel special</h1>
<p>Un tabel cu "celule lipite"
</p> 
<table style="width:100%">
<caption>Echipe si hobby-uri</caption>
  <tr>
    <th>Echipa</th>
	<th>Nume</th>
    <th colspan="2">Pasiuni</th>
  </tr>
  <tr>
	<td rowspan="3">Munte</td>
    <td>Popescu</td>
    <td>calatorii</td>
    <td>filatelie</td>
  </tr>
  <tr>
	
    <td>Ionescu</td>
    <td>planorism</td>
    <td>sah</td>
  </tr>
  <tr>
    <td>Vasilescu</td>
    <td>drumeții</td>
    <td>fotografie</td>
</tr>
  <tr>
	<td rowspan="4">Mare</td>
    <td>Georgescu</td>
    <td>plaja</td>
    <td>dans</td>
  </tr>
  <tr>
	
    <td>Gigescu</td>
    <td>surf</td>
    <td>samba</td>
  </tr>
  <tr>
	
    <td>Mintescu</td>
    <td>politica</td>
    <td>delicateturi</td>
  </tr>
  <tr>
    <td>Marinescu</td>
    <td>înot</td>
    <td>pescuit</td>
</tr>
</table>
</body>
</html>
