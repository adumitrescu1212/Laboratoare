<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Pagina principala</title>

    <style>
        ul {
            list-style-type: none;
            padding: 0;
        }

        li {
            margin-bottom: 10px;
        }

        li a {
            display: block;
            width: 200px;
            padding: 12px;
            box-sizing: border-box;
            background-color: #2874A6;
            color: white;
            text-decoration: none;
            text-align: center;
            border-radius: 8px;
        }

        li a:hover {
            background-color: #1A5276;
        }
    </style>
</head>
