<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS_C1</title>
<style>
    #hd {
        font-variant: small-caps;
        color: magenta;
    }
    body {
        background-color: #ffffcc;
    }
    .center, p {
        text-align: center;
        color: red;
    }
    table {
        width: 100%;
        border-collapse: collapse;
    }
    table, th, td {
        border: 2px solid green;
    }
    caption {
        background-color: orange;
        color: white;
        font-size: 1.4em;
        font-weight: bold;
        padding: 10px;
    }
    th {
        background-color: magenta;
        padding: 12px;
        text-align: center;
    }
    td {
        background-color: orange;
        padding: 12px 18px;
    }
    td.echipa {
        background-color: magenta;
        font-weight: bold;
        text-align: center;
    }
</style>
</head>
<body>

<h1 id="hd">Tabel special</h1>
<p>Un tabel cu "celule lipite"</p> 

<table>
<caption>Echipe si hobby-uri</caption>
  <tr>
    <th>Echipa</th>
    <th>Nume</th>
    <th colspan="2">Pasiuni</th>
  </tr>
  <tr>
    <td rowspan="3" class="echipa">Munte</td>
    <td>Popescu</td>
    <td>calatorii</td>
    <td>filatelie</td>
  </tr>
  <tr>
    <td>Ionescu</td>
    <td>planorism</td>
    <td>sah</td>
  </tr>
  <tr>
    <td>Ion</td>
    <td>lectura</td>
    <td>fotografie</td>
  </tr>
  <tr>
    <td rowspan="4" class="echipa">Mare</td>
    <td>Georgescu</td>
    <td>plaja</td>
    <td>dans</td>
  </tr>
  <tr>
    <td>Gigescu</td>
    <td>surf</td>
    <td>samba</td>
  </tr>
  <tr>
    <td>Mintescu</td>
    <td>politica</td>
    <td>delicateturi</td>
  </tr>
  <tr>
    <td>Pop</td>
    <td>inot</td>
    <td>pescuit</td>
  </tr>
</table>

<!-- 
Explicații 4+5+6:
-tabelul a fost îmbunătățit cu chenare, margini colapsate (border-collapse) 
și padding pentru o mai bună lizibilitate-
-am adăugat câte un membru nou în fiecare echipă
-am refacut tabelul conform cerintelor
-->
</body>
</html>
