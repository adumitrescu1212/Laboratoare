<!DOCTYPE html>
<html>
<head>
<title>Modificari cu JavaScript in tag</title>

</head>
<body>
    <p id="paragraf">Paragraf de modificat.</p>
    
    <button onclick="var p = document.getElementById('paragraf'); 
    p.style.backgroundColor = 'pink'; 
    p.style.color = 'red';">
        Click!!
    </button>
</body>
</html>
