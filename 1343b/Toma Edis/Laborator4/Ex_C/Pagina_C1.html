<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS_C1</title>
<style>

        #hd {
        font-variant: small-caps;
        color:magenta;
    }
     h1, caption {
        color: blue;
    background-color: #cccc00;
    }
      body {
    background-color: #ffffcc;
    }
.center, p {
  text-align: center;
  color: red;
}
table, th, td {
  border: 1px black;
  border-collapse:collapse;
}
th, td {
  padding: 10px;
  border: 2px solid green;
  }
.titlu {
  color: white;
  font-size: 25px;  
  background-color: orange;
}
th {
  background-color: magenta;
}
td {
  background-color: orange;
}
.echipa {
  background-color: magenta;
  font-weight: bold;
  text-align-last: center;
}
table {
    border-collapse: collapse;
}
caption {
    background-color: orange; 
    color: white; 
    font-size: 24px; 
    font-weight: bold;
    padding: 10px;
}
th {
    background-color: magenta; 
    border: 2px solid green; 
    padding: 15px; 
}
td {
    background-color: orange; 
    border: 2px solid green; 
    padding: 15px; 
}

td.nume-echipa { 
    background-color: magenta; 
    font-weight: bold; 
    text-align: center; 
}
</style>
</head>
<body>

<h1 id="hd">Tabel special</h1>
<p>Un tabel cu "celule lipite"
</p> 
<table style="width:100%">
<caption class="titlu">Echipe si hobby-uri</caption>
  <tr>
  <th>Echipa</th>

  </tr>

  </tr>
  <tr>
	<td rowspan="4" class="echipa">Mare</td>
    <td>Georgescu</td>
    <td>plaja</td>
    <td>dans</td>
  </tr>
  <tr>
	
    <td>Gigescu</td>

  </tr>
  <tr>

  </tr>

    <td>Maricica</td>

  </tr>
</table>

</html>
