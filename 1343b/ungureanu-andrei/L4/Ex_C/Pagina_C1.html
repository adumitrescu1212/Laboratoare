
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS_C1</title>

<style>
    #hd {
        font-variant: small-caps;
        color: magenta;
    }

    h1 {
        color: blue;
        background-color: #cccc00;
    }

    body {
        background-color: #ffffcc;
    }

    .center, p {
        text-align: center;
        color: red;
    }

    /* Formatarea tabelului */
    table {
        width: 100%;
        border-collapse: collapse;
    }

    th, td {
        border: 2px solid green;
        padding: 18px;
        text-align: center;
        background-color: #ff9933;
    }

    th {
        background-color: magenta;
        color: white;
    }

    caption {
        color: white;
        font-size: 24px;
        font-weight: bold;
        background-color: orange;
        padding: 15px;
    }

    /* Celulele cu numele echipelor */
    .echipa {
        background-color: magenta;
        color: white;
        font-weight: bold;
        text-align: center;
    }
</style>
</head>

<body>

<h1 id="hd">Tabel special</h1>

<p>Un tabel cu "celule lipite"</p>

<table>
<caption>Echipe si hobby-uri</caption>

    <tr>
        <th>Echipa</th>
        <th>Nume</th>
        <th colspan="2">Pasiuni</th>
    </tr>

    <tr>
        <td rowspan="3" class="echipa">Munte</td>
        <td>Popescu</td>
        <td>calatorii</td>
        <td>filatelie</td>
    </tr>

    <tr>
        <td>Ionescu</td>
        <td>planorism</td>
        <td>sah</td>
    </tr>

    <tr>
        <td>Marinescu</td>
        <td>drumetii</td>
        <td>fotografie</td>
    </tr>

    <tr>
        <td rowspan="4" class="echipa">Mare</td>
        <td>Georgescu</td>
        <td>plaja</td>
        <td>dans</td>
    </tr>

    <tr>
        <td>Gigescu</td>
        <td>surf</td>
        <td>samba</td>
    </tr>

    <tr>
        <td>Mintescu</td>
        <td>politica</td>
        <td>delicateturi</td>
    </tr>

    <tr>
        <td>Vasilescu</td>
        <td>inot</td>
        <td>pescuit</td>
    </tr>

</table>

</body>
</html>
