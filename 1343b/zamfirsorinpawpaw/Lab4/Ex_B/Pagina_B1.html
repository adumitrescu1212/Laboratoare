<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS_B1</title>
<style>
    body {
        background-color: #ffffcc;
    }
    .center {
        text-align: center;
        color: white;
    }
    h1 {
        background-color: #00cc66;
        color: orange;
    }
    
    
    #s1 table {
        background-color: blue;
        color: white;
    }

   
    #s2 table {
        border-collapse: collapse;
    }
    #s2 table th, 
    #s2 table td {
        border: 1px solid black;
        padding: 8px;
        background-color: transparent;
    }

    div {
        color: blue;
    }
</style>
</head>
<body>

<h1 class="center">Tabele formatate</h1>

<div id="s1">
<table style="width:100%" class="center">
  <tr>
    <th>Firstname</th>
    <th>Lastname</th>
    <th>Age</th>
  </tr>
  <tr>
    <td>Jill</td>
    <td>Smith</td>
    <td>50</td>
  </tr>
  <tr>
    <td>Eve</td>
    <td>Jackson</td>
    <td>94</td>
  </tr>
</table>
<br>
</div> 

<div id="s2" style="width:50%">
<br>
<table style="width:100%">
  <tr>
    <th>Firstname</th>
    <th>Lastname</th>
    <th>Age</th>
  </tr>
  <tr>
    <td>Jill</td>
    <td>Smith</td>
    <td>50</td>
  </tr>
  <tr>
    <td>Eve</td>
    <td>Jackson</td>
    <td>94</td>
  </tr>
</table>
</div> 


</body>
</html>
