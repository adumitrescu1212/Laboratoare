<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS_C1</title>
<style>
    body {
        background-color: #ffffcc;
    }
    #hd {
        font-variant: small-caps;
        color: black;
    }
    table {
        width: 100%;
        border-collapse: collapse;
    }
    th, td {
        border: 2px solid green;
        padding: 12px;
    }
    caption {
        color: white;
        font-size: 24px;
        background-color: orange;
        font-weight: bold;
        padding: 10px;
    }
    th {
        background-color: magenta;
        color: white;
    }
    td {
        background-color: orange;
    }
    .echipa {
        background-color: magenta;
        font-weight: bold;
        text-align: center;
        color: black;
    }
</style>
</head>
<body>

<h1 id="hd">TABEL SPECIAL</h1>
<p>Un tabel cu "celule lipite"</p>

<table>
<caption>Echipe si hobby-uri</caption>
  <tr>
    <th>Echipa</th>
    <th>Nume</th>
    <th>Pasiune 1</th>
    <th>Pasiune 2</th>
  </tr>
  <tr>
    <td class="echipa" rowspan="3">Munte</td>
    <td>Sorin</td>
    <td>alpinism</td>
    <td>atletism</td>
  </tr>
  <tr>
    <td>Cornel</td>
    <td>planorism</td>
    <td>sah</td>
  </tr>
  <tr>
    <td>Cosmin</td>
    <td>drumetii</td>
    <td>fotografie</td>
  </tr>
  <tr>
    <td class="echipa" rowspan="4">Mare</td>
    <td>Sorin2</td>
    <td>plaja</td>
    <td>inot</td>
  </tr>
  <tr>
    <td>Vasile</td>
    <td>surf</td>
    <td>volei</td>
  </tr>
  <tr>
    <td>Radu</td>
    <td>plimbare</td>
    <td>scufundari</td>
  </tr>
  <tr>
    <td>Cristi</td>
    <td>navigatie</td>
    <td>pescuit</td>
  </tr>
</table>


</body>
</html>
