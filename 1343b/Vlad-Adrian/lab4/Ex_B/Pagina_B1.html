<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>CSS_B1</title>
  <style>
    body {
      background-color: #ffffcc;
    }

    .center {
      text-align: center;
      color: white;
    }

    h1 {
      background-color: #00cc66;
      color: orange;
    }

    table,
    th,
    td {
      border: 1px solid black;
      border-collapse: collapse;
    }

    .centre,
    .centre th,
    .centre td {
      border: 5px solid blue;
      padding: 15px;
    }

    #s1 {
      background-color: #00cc66;
    }

    #s1 table {
      background-color: blue;
    }

    #s2 {
      background-color: yellow;
    }

    div {
      color: blue;
    }
  </style>
</head>

<body>

  <h1 class="center">Tabele formatate</h1>
  <div id="s1">
    <table style="width:100%" class="center">
      <tr>
        <th>Firstname</th>
        <th>Lastname</th>
        <th>Age</th>
      </tr>
      <tr>
        <td>Jill</td>
        <td>Smith</td>
        <td>50</td>
      </tr>
      <tr>
        <td>Eve</td>
        <td>Jackson</td>
        <td>94</td>
      </tr>
    </table>
    <br>
  </div>
  <div id="s2" style="width:50%">
    <br>
    <table style="width:100%" class="centre">
      <tr>
        <th class="centre">Firstname</th>
        <th class="centre">Lastname</th>
        <th class="centre">Age</th>
      </tr>
      <tr>
        <td class="centre">Jill</td>
        <td class="centre">Smith</td>
        <td class="centre">50</td>
      </tr>
      <tr>
        <td class="centre">Eve</td>
        <td class="centre">Jackson</td>
        <td class="centre">94</td>
      </tr>
    </table>
  </div>

  <!--
Exercițiul 3:
1. Tabelele au fundaluri diferite deoarece nu au o culoare de fundal proprie și sunt transparente implicit. 
Prin urmare, se vede fundalul div-urilor părinte (#s1 verde, #s2 galben). 
Am setat fundalul primului tabel adăugând regula #s1 table { background-color: blue; }.

2. Celulele din al doilea tabel arătau diferit deoarece doar antetul și prima celulă din fiecare rând aveau clasa centre (chenar de 5px și padding de 15px), 
iar restul aveau stilul implicit de tabel. Pentru uniformizare, am aplicat stilul clasei centre tuturor celulelor.
-->
</body>

</html>
