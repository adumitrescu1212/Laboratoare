<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <title>Laboratorul 3 – Stiluri CSS</title>
  <style>
    ul.butoane {
      list-style-type: none;
      padding: 0;
      margin: 15px 0;
    }

    ul.butoane li {
      display: inline-block;
      margin-right: 10px;
    }

    ul.butoane li a {
      display: inline-block;
      padding: 10px 18px;
      color: white;
      text-decoration: none;
      border-radius: 6px;
      font-family: Arial, sans-serif;
      font-size: 14px;
    }

    ul.butoane li.inline a {
      background-color: #007bff;
    }

    ul.butoane li.internal a {
      background-color: #28a745;
    }

    ul.butoane li.external a {
      background-color: #dc3545;
    }

    ul.butoane li a:hover {
      opacity: 0.85;
    }
  </style>
</head>
<body>
  <h1>Laboratorul 3 – stiluri CSS</h1>
  <p><a href="FormtareText.html">Indicații</a></p>

  <ul class="butoane">
    <li class="inline"><a href="FormtareText_inline.html">Stiluri inline</a></li>
    <li class="internal"><a href="FormtareText_internal.html">Stiluri interne</a></li>
    <li class="external"><a href="FormtareText_external.html">Stiluri externe</a></li>
  </ul>

  <p><a href="../index.html">Laboratoarele mele</a></p>
</body>
</html>
