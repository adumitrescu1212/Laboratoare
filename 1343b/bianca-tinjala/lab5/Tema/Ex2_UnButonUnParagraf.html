<!DOCTYPE html>
<html>
<head>
<title>Modificari cu JavaScript in tag</title>

</head>
<body>

<h1>Modificari paragraf la click pe buton</h1>

<p id="paragraf">
    Acesta este un paragraf.
</p>

<button onclick="
    document.getElementById('paragraf').style.backgroundColor='pink';
    document.getElementById('paragraf').style.color='red';
">
    Schimba culorile
</button>

<button >Click!</button>

</body>
</html>
