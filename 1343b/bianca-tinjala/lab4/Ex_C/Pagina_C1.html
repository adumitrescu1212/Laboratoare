<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS_C1</title>
<style>

        #hd {
        font-variant: small-caps;
        color:magenta;
    }
     h1, caption {
        color: blue;
    background-color: #cccc00;
    }
      body {
    background-color: #ffffcc;
    }
.center, p {
  text-align: center;
  color: red;
}

/* Exercițiul 4 & 6: Formatare tabel */
table {
    border-collapse: collapse;
}

table, th, td {
    border: 1px solid green;
}

th, td {
    padding: 8px;
}

caption {
    color: white;
    font-size: 1.4em;
    font-weight: bold;
    background-color: orange;
    padding: 6px;
}

th {
    background-color: magenta;
}

td {
    background-color: orange;
}

td.echipa {
    background-color: magenta;
    font-weight: bold;
    text-align: center;
    vertical-align: middle;
}

</style>
</head>
<body>

<h1 id="hd">Tabel special</h1>
<p>Un tabel cu "celule lipite"
</p> 
<table style="width:100%">
<caption>Echipe si hobby-uri</caption>
  <tr>
    <th>Echipa</th>
	<th>Nume</th>
    <th colspan="2">Pasiuni</th>
  </tr>
  <tr>
	<td rowspan="3" class="echipa">Munte</td>
    <td>Popescu</td>
    <td>calatorii</td>
    <td>filatelie</td>
  </tr>
  <tr>
	
    <td>Ionescu</td>
    <td>planorism</td>
    <td>sah</td>
  </tr>
  <tr>
    <td>Vasilescu</td>
    <td>alpinism</td>
    <td>drumetii</td>
  </tr>
  <tr>
	<td rowspan="4" class="echipa">Mare</td>
    <td>Georgescu</td>
    <td>plaja</td>
    <td>dans</td>
  </tr>
  <tr>
	
    <td>Gigescu</td>
    <td>surf</td>
    <td>samba</td>
  </tr>
  <tr>
	
    <td>Mintescu</td>
    <td>politica</td>
    <td>delicateturi</td>
  </tr>
  <tr>
    <td>Marinescu</td>
    <td>inot</td>
    <td>pescuit</td>
  </tr>
</table>

<!--
Explicatie Ex 4, 5, 6:
- Ex 4 (Lizibilitate): Am pus chenare verzi (border), le-am contopit intr-o singura linie (border-collapse: collapse) si am pus spatiu in celule (padding: 8px).
- Ex 5 (Membri noi): Am adaugat cate un membru cu 2 pasiuni in fiecare echipa. Am marit rowspan la 3 pentru 'Munte' si la 4 pentru 'Mare' ca celula sa se intinda pe toti membrii.
- Ex 6 (Culori din macheta):
  * Titlu tabel (caption): text alb, mare, pe fond portocaliu.
  * Antet (th): fond magenta.
  * Celule (td): fond portocaliu.
  * Echipe (td.echipa): fond magenta, text bold si centrat.
  * Titlul paginii si paragraful au ramas neschimbate.
-->
</body>
</html>
