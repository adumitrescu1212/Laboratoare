<!DOCTYPE html>
<html>
<head>
<title> Exemplu modificare paragraf </title>
</head>
<body>

<h1> Modificari paragraf la click</h1>

<p style="background-color:yellow" onclick="this.style.color = 'blue'; this.style.fontSize = '25px'; this.style.backgroundColor = 'red'; this.innerHTML='Modificari efectuate'"> Dati click pe paragraf pentru a efectua modificari</p>
<p style="background-color:yellow; color:blue"    onmouseover="this.style.backgroundColor = 'blue'; this.style.color = 'yellow';"    onmouseout="this.style.backgroundColor = 'yellow'; this.style.color = 'blue';">    Paragraf de modificat</p> 
</body>
</html>
