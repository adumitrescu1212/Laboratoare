<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS_C1</title>
<style>
  #hd {
    font-variant: small-caps;
    color: magenta;
  }

  h1, caption {
    color: blue;
    background-color: #cccc00;
  }

  body {
    background-color: #ffffcc;
  }

  .center, p {
    text-align: center;
    color: red;
  }

  table {
    border-collapse: collapse;
    width: 100%;
  }

  caption {
    color: white;
    background-color: orange;
    font-size: 28px;
    padding: 6px;
  }

  th, td {
    border: 2px solid green;
    padding: 15px;
  }

  th {
    background-color: magenta;
    text-align: center;
  }

  td {
    background-color: orange;
  }

  td[rowspan] {
    background-color: magenta;
    font-weight: bold;
    text-align: center;
  }
</style>
</head>
<body>

<h1 id="hd">Tabel special</h1>
<p>Un tabel cu "celule lipite"</p>

<table>
  <caption>Echipe si hobby-uri</caption>
  <tr>
    <th>Echipa</th>
    <th>Nume</th>
    <th colspan="2">Pasiuni</th>
  </tr>
  <tr>
    <td rowspan="3">Munte</td>
    <td>Popescu</td>
    <td>calatorii</td>
    <td>filatelie</td>
  </tr>
  <tr>
    <td>Ionescu</td>
    <td>planorism</td>
    <td>sah</td>
  </tr>
  <tr>
    <td>Vasilescu</td>
    <td>alpinism</td>
    <td>fotografie</td>
  </tr>

  <tr>
    <td rowspan="4">Mare</td>
    <td>Georgescu</td>
    <td>plaja</td>
    <td>dans</td>
  </tr>
  <tr>
    <td>Gigescu</td>
    <td>surf</td>
    <td>samba</td>
  </tr>
  <tr>
    <td>Mintescu</td>
    <td>politica</td>
    <td>delicateturi</td>
  </tr>
  <tr>
    <td>Dumitrescu</td>
    <td> inot</td>
    <td>lectura</td>
  </tr>
</table>

</body>
</html>
