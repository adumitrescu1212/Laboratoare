<!DOCTYPE html>
<html>
<head>
<title>Modificari cu JavaScript in tag</title>

</head>
<body>

<h1>Modificari paragraf la click pe buton</h1>

<p id="paragraf3">Acest paragraf isi schimba culoarea</p>

<button onclick="document.getElementById('paragraf3').style.backgroundColor = 'pink'; document.getElementById('paragraf3').style.color = 'red';">Click!</button>

</body>
</html>
