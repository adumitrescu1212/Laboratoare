<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS_C1</title>
<style>

	#hd {
		font-variant: small-caps;
		color: magenta;
	}
	h1, caption {
		color: blue;
		background-color: #cccc00;
	}
	body {
		background-color: #ffffcc;
	}
	.center, p {
		text-align: center;
		color: red;
	}

	table, th, td {
		border: 3px solid green;
		border-collapse: collapse;
    
	}

  .echipa{
  background-color: magenta;
  text-align: center;
  font-weight: bold;
  }



  th{background-color: magenta;}
  td{background-color: orange;}

  .titlu{
  color:white;
  background-color: orange;
	padding: 8px;
  font-size: 32px;
  }

	th, td {
	padding: 12px;
	}

</style>
</head>
<body>

<h1 id="hd">Tabel special</h1>
<p>Un tabel cu "celule lipite"</p> 

<table style="width:100%">
<caption class="titlu">Echipe si hobby-uri</caption>
	<tr>
		<th>Echipa</th>
		<th>Nume</th>
		<th colspan="2">Pasiuni</th>
	</tr>
	<tr>
	<td class=echipa rowspan="3">Munte</td>
		<td>Popescu</td>
		<td>calatorii</td>
		<td>filatelie</td>
	</tr>
	<tr>
		<td>Ionescu</td>
		<td>planorism</td>
		<td>sah</td>
	</tr>
	  <tr>
		  <td>Vasilescu</td>
		  <td>fotbal</td>
		  <td>jocurile</td>
	  </tr>
	<tr>

	<td class=echipa rowspan="4">Mare</td>
		<td>Georgescu</td>
		<td>plaja</td>
		<td>dans</td>
	</tr>
	<tr>
		<td>Gigescu</td>
		<td>surf</td>
		<td>samba</td>
	</tr>
	<tr>
		<td>Mintescu</td>
		<td>politica</td>
		<td>delicateturi</td>
	</tr>
	  <tr>
		  <td>Catalinescu</td>
		  <td>vanatoare</td>
		  <td>pescuit</td>
	  </tr>
</table>
</body>
</html>
