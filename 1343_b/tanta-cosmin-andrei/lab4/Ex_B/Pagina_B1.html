<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS_B1</title>
<style>
    body {
    background-color: #ffffcc;
    }
.center {
  text-align: center;
  color: white;
}
    h1 {
        background-color: #00cc66;
        color: orange;
    }
table, th, td {
  border: 1px solid black;
  border-collapse: collapse;
}
.centre {
border: 5px solid black;
padding: 15px;
text-align: center;
}
#s1 {
background-color: blue;
}
#s2 {
background-color: yellow;
}
div {
color:blue;
}
</style>
</head>
<body>

<h1 class="center">Tabele formatate</h1>
<div id="s1">
<table style="width:100%" class="center">
  <tr>
    <th class="centre">Firstname</th>
    <th class="centre">Lastname</th>
    <th class="centre">Age</th>
  </tr>
  <tr>
    <td class="centre">Jill</td>
    <td class="centre">Smith</td>
    <td class="centre">50</td>
  </tr>
  <tr>
    <td class="centre">Eve</td>
    <td class="centre" >Jackson</td>
    <td class="centre">94</td>
  </tr>
</table>
</div> 
<br>
<br>
<div id="s2" style="width:100%">
<table style="width:100%" class="centre">
  <tr>
    <th class="centre">Firstname</th>
    <th class="centre">Lastname</th>
    <th class="centre">Age</th>
  </tr>
  <tr>
    <td class="centre">Jill</td>
    <td class="centre">Smith</td>
    <td class="centre" >50</td>
  </tr>
  <tr>
    <td class="centre">Eve</td>
    <td class="centre">Jackson</td>
    <td class="centre">94</td>
  </tr>
</table>
</div> 


</body>
</html>

<!-- Blocurile #s1 si #s2 atribuie culorii diferite iar fiecare tabel se afla intr-un <div> seperat cu stilurile id s1, respectiv s2  -->
<!-- style="width:50%" pentru al doilea tabel reduce din lungime in jumatate, clasa "centre" diferita de "center" iar -->
