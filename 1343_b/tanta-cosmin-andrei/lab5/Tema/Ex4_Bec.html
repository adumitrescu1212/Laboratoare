<!DOCTYPE html>
<html>
<head>
<title> Bec </title>
<script>
function light(sw) {
    var pic;
    if (sw == 0) {
        pic = "Bec_stins.gif"
    } else {
        pic = "Bec_aprins.gif"
    }
    document.getElementById('bec').src = pic;
}
function changeImage() {
    var image = document.getElementById('bec2');
    if (image.src.match("bulbon")) {
        image.src = "Bec_stins.gif";
    } else {
        image.src = "Bec_aprins.gif";
    }
}
</script>
</head>
<body>

<h1>Bec stins</h1>

<p>
<img onmouseover="onclick=light(1);" onmouseout="onclick=light(0);" 
id="bec"  src="Bec_stins.gif" width="100" height="180">
</p>




</body>
</html>
