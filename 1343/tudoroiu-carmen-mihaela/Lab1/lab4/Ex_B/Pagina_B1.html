<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS_B1</title>
<style>
    body {
    background-color: #ffffcc;
    }
.center {
  text-align: center;
  color: white;
}
    h1 {
        background-color: #00cc66;
        color: orange;
    }
table, th, td {
  border: 1px solid black;
  border-collapse: collapse;
}
.centre {
border: 5px solid blue;
 padding: 15px;
}
#s1 {
background-color: #00cc66;
}
#s2 {
background-color: yellow;
}
div {
color:blue;
}
</style>
</head>
<body>

<h1 class="center">Tabele formatate</h1>
<div id="s1">
<table style="width:100%; background-color: blue;" class="center">
  <tr>
    <th>Firstname</th>
    <th>Lastname</th>
    <th>Age</th>
  </tr>
  <tr>
    <td>Jill</td>
    <td>Smith</td>
    <td>50</td>
  </tr>
  <tr>
    <td>Eve</td>
    <td>Jackson</td>
    <td>94</td>
  </tr>
</table>
<br>
</div> 
<div id="s2" style="width:50%">
<br>
<table style="width:100%" class="centre">
  <tr>
    <th class="centre">Firstname</th>
    <th class="centre">Lastname</th>
    <th class="centre">Age</th>
  </tr>
  <tr>
    <td class="centre">Jill</td>
    <td class="centre">Smith</td>
    <td class="centre">50</td>
  </tr>
  <tr>
    <td class="centre">Eve</td>
    <td class="centre">Jackson</td>
    <td class="centre">94</td>
  </tr>
</table>
</div> 


</body>
</html>
<!-- Fundalul celor doua tabele este diferit, chiar daca nu au reguli de tip background color deoarece la fiecare diviziune (div) am atasat cate un indicator, s1 si respectiv s2, carora le-au fost atribuite culori specifice ca background color: verde pentru prima si galben pentru cea de a doua. Din acest motiv sunt diferite -->
<!-- celulele din cel de al doilea tabel difera ca aspect deoarece unele fac parte din clasa centre care aduce modificari de stil prin atributele din <style> corespunzatoare, iar celelalte nu fac parte din nicio clasa si respecta stilul standard -->
