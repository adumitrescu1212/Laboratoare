<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Exercițiul 6 - Contor bec</title>
</head>
<body>

    <h1>Bec cu contor</h1>

    <p>
        <img src="Bec stins.gif" width="100" height="180" id="bec" onclick="schimbaBec();" style="cursor: pointer;">
    </p>

    <p id="mesaj">Becul a fost aprins de 0 ori.</p>

    <script>
        let contor = 0;

        function schimbaBec() {
            let bec = document.getElementById("bec");
            let mesaj = document.getElementById("mesaj");

            console.log(bec.src);

            if (bec.src.includes("Bec%20stins.gif") || bec.src.includes("Bec stins.gif")) {
                bec.src = "Bec aprins.gif";
                contor++;
                mesaj.innerText = "Becul a fost aprins de " + contor + " ori.";
            } else {
                bec.src = "Bec stins.gif";
            }
        }
    </script>

</body>
</html>
