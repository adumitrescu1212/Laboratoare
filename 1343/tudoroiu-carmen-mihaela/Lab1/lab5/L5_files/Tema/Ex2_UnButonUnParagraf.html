<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Modificari cu JavaScript in tag</title>
</head>
<body>

    <h1>Modificari paragraf la click pe buton</h1>

    <p id="p1">Paragraf de modificat</p>

    <button onclick="document.getElementById('p1').style.backgroundColor='pink'; document.getElementById('p1').style.color='red';">
        Click!
    </button>

</body>
</html>
