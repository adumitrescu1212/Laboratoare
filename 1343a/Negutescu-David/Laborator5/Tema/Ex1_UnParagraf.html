<!DOCTYPE html>
<html>
<head>
<title> Exercitiu modificare paragraf </title>
</head>
<p style="background-color:yellow; color:blue"
 onmouseover="this.style.backgroundColor = 'blue'; this.style.color = 'yellow';"
 onmouseout="this.style.backgroundColor = 'yellow'; this.style.color = 'blue';">
 Paragraf de modificat</p>
<body>

<h1> Modificari paragraf la mouseover/mouseout</h1>

<p> Paragraf de modificat</p>
</body>
</html>
