<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS_C1</title>
<style>
    #hd {
        font-variant: small-caps;
        color: magenta;
        background-color: #cccc00;
        padding: 10px;
    }

    body {
        background-color: #ffffcc;
    }

    .center, p {
        text-align: center;
        color: red;
    }

    table {
        border-collapse: collapse;
        border: 2px solid green;
        width: 100%;
    }

    caption {
        background-color: orange;
        color: white;
        font-size: 1.4em;
        font-weight: bold;
        padding: 10px;
    }

    th {
        background-color: magenta;
        color: black;
        border: 1px solid green;
        padding: 10px;
    }

    td {
        background-color: orange;
        color: black;
        border: 1px solid green;
        padding: 10px;
    }

    td.echipa {
        background-color: magenta;
        font-weight: bold;
        text-align: center;
    }
</style>
</head>
<body>

<h1 id="hd">Tabel special</h1>
<p>Un tabel cu "celule lipite"</p> 

<table>
<caption>Echipe si hobby-uri</caption>
  <tr>
    <th>Echipa</th>
    <th>Nume</th>
    <th colspan="2">Pasiuni</th>
  </tr>
  <tr>
    <td rowspan="3" class="echipa">Munte</td>
    <td>Popescu</td>
    <td>calatorii</td>
    <td>filatelie</td>
  </tr>
  <tr>
    <td>Ionescu</td>
    <td>planorism</td>
    <td>sah</td>
  </tr>
  <tr>
    <td>Vasilescu</td>
    <td>fotbal</td>
    <td>muzica</td>
  </tr>
  <tr>
    <td rowspan="4" class="echipa">Mare</td>
    <td>Georgescu</td>
    <td>plaja</td>
    <td>dans</td>
  </tr>
  <tr>
    <td>Gigescu</td>
    <td>surf</td>
    <td>samba</td>
  </tr>
  <tr>
    <td>Mintescu</td>
    <td>politica</td>
    <td>delicateturi</td>
  </tr>
  <tr>
    <td>Marinescu</td>
    <td>tenis</td>
    <td>lectura</td>
  </tr>
</table>

</body>
</html>
