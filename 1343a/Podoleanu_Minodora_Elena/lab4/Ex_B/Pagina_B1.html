<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS_B1</title>
<style>
    body {
        background-color: #ffffcc;
    }

    .center {
        text-align: center;
        color: white;
    }

    h1 {
        background-color: #00cc66;
        color: orange;
    }

    table, th, td {
        border: 1px solid black;
        border-collapse: collapse;
    }

    .centre {
        padding: 15px;
    }

    #s1 {
        background-color: #00cc66;
    }

    #s2 {
        background-color: yellow;
    }

    div {
        color: blue;
    }

   
    table:first-of-type {
        background-color: blue;
        color: white;
    }

    
    td, th {
        padding: 8px;
    }
</style>
</head>
<body>

<h1 class="center">Tabele formatate</h1>

<div id="s1">
<table style="width:100%" class="center">
  <tr>
    <th>Firstname</th>
    <th>Lastname</th>
    <th>Age</th>
  </tr>
  <tr>
    <td>Jill</td>
    <td>Smith</td>
    <td>50</td>
  </tr>
  <tr>
    <td>Eve</td>
    <td>Jackson</td>
    <td>94</td>
  </tr>
</table>
<br>
</div> 

<div id="s2" style="width:50%">
<br>
<table style="width:100%">
  <tr>
    <th>Firstname</th>
    <th>Lastname</th>
    <th>Age</th>
  </tr>
  <tr>
    <td>Jill</td>
    <td>Smith</td>
    <td>50</td>
  </tr>
  <tr>
    <td>Eve</td>
    <td>Jackson</td>
    <td>94</td>
  </tr>
</table>
</div> 

</body>
</html>

<!-- 
Explicații: 
1. Cele două tabele aveau fundaluri diferite deoarece primul tabel era transparent (se vedea 
fundalul div-ului părinte #s1), pe când al doilea tabel era plasat într-un div cu fundal galben (#s2).
2. Celulele celui de-al doilea tabel arătau diferit deoarece unele celule aveau clasa .centre 
(care le dădea border albastru de 5px și padding 15px), iar altele nu. Prin uniformizarea 
aplicată, toate celulele respectă acum aceeași grilă de margini și spațiere.
-->
