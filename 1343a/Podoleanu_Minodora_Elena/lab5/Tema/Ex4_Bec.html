<!DOCTYPE html>
<html>
<head>
<title>Bec la Hover</title>
</head>
<body>

<h1>Bec interactiv la trecerea mouse-ului</h1>

<p>
<img id="bec" 
     onmouseover="this.src='Bec aprins.gif';" 
     onmouseout="this.src='Bec stins.gif';" 
     src="Bec stins.gif" 
     width="100" 
     height="180">
</p>

<p>Treci cu mouse-ul peste bec pentru a-l aprinde.</p>

</body>
</html>
