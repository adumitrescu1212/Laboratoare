<!DOCTYPE html>
<html>
<head>
<title>Modificari cu JavaScript in tag</title>
</head>
<body>

<h1>Modificari paragraf la click pe buton</h1>

<p id="p1">Paragraf de modificat</p>

<button type="button" onclick="var p = document.getElementById('p1'); p.style.color='blue'; p.style.fontSize='25px'; p.style.backgroundColor='yellow'; p.innerHTML='Paragraf modificat!';">Apasa-ma!</button>

</body>
</html>
