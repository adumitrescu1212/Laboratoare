<!DOCTYPE html>
<html>
<head>
<title> Exercitiu modificare paragraf </title>
</head>
<body>

<h1> Modificari paragraf la mouseover/mouseout</h1>

<p onmouseover="this.style.color='blue'; this.style.backgroundColor='yellow';" onmouseout="this.style.color='black'; this.style.backgroundColor='transparent';"> Paragraf de modificat</p>

</body>
</html>
