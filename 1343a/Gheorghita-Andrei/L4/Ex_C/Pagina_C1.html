<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS_C1</title>
<style>

        #hd {
        font-variant: small-caps;
        color:magenta;
        }
         h1, caption {
            color: blue;
        background-color: #cccc00;
        }
          body {
        background-color: #ffffcc;
        }
        .center, p {
          text-align: center;
          color: red;
        }
        tabel{
            border: 5px solid green;
            border-collapse: collapse;
            padding: 3px;
        }
        table, th, td {
            border: 3px solid green;
            border-collapse: collapse;
        }
        #cap {
            color: white;
            background-color: orange;
            font: 200% Arial, sans-serif;
        }
        th, #mare, #munte {
            background-color: magenta;
            text-align: center;
            font: bolder 100% Arial, sans-serif;
        }
        td {
            background-color: orange;
            font: 100% Arial, sans-serif;
            padding: 7px;
        }

</style>
</head>
<body>

    <h1 id="hd">Tabel special</h1>
    <p>Un tabel cu "celule lipite"
    </p> 

    <table style="width:100%" class="tabel">
        <caption id="cap">Echipe si hobby-uri</caption>
        <tr>
            <th>Echipa</th>
            <th>Nume</th>
            <th colspan="2">Pasiuni</th>
        </tr>
        <tr>
            <td rowspan="3" id="munte">Munte</td>
            <td>Popescu</td>
            <td>calatorii</td>
            <td>filatelie</td>
        </tr>
        <tr>

            <td>Ionescu</td>
            <td>planorism</td>
            <td>sah</td>
        </tr>
        <tr>
            <td>Vasilescu</td>
            <td>fotbal</td>
            <td>pescuit</td>
        </tr>
        <tr>
            <td rowspan="4" id="mare">Mare</td>
            <td>Georgescu</td>
            <td>plaja</td>
            <td>dans</td>
        </tr>
        <tr>

            <td>Gigescu</td>
            <td>surf</td>
            <td>samba</td>
        </tr>
        <tr>

            <td>Mintescu</td>
            <td>politica</td>
            <td>delicateturi</td>
        </tr>
        <tr>
            <td>Radu</td>
            <td>muzica</td>
            <td>pictura</td>
        </tr>
    </table>
</body>
</html>
