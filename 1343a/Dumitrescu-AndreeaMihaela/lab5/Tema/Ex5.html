<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<title>Ex5 - alerte si fundalul paginii</title>
</head>
<body>

<h1>Ordinea de încărcare a paginii</h1>

<script>
    window.alert("Titlul a fost afisat. Urmeaza primul paragraf.");
    console.log("Alerta 1: dupa titlu");
</script>

<p onclick="document.body.style.backgroundColor = 'yellow'">
   Primul paragraf: dati clic aici si fundalul paginii devine galben.</p>

<script>
    window.alert("Primul paragraf a fost afisat. Urmeaza al doilea.");
    console.log("Alerta 2: intre paragrafe");
</script>

<p onclick="document.body.style.backgroundColor = 'orange'">
   Al doilea paragraf: dati clic aici si fundalul paginii devine portocaliu.</p>

<p><a href="index.html">Înapoi</a></p>
</body>
</html>
