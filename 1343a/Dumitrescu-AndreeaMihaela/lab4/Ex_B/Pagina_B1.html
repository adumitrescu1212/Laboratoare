<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>CSS_B1</title>
<style>
    body {
        background-color: #ffffcc;
    }
    .center {
        text-align: center;
        color: white;
    }
    h1 {
        background-color: #00cc66;
        color: orange;
    }
    table, th, td {
        border: 1px solid black;
        border-collapse: collapse;
    }
    /* Am adaugat .centre td pentru a uniformiza toate celulele tabelului 2 */
    .centre, .centre td {
        border: 5px solid blue;
        padding: 15px;
    }
    /* Fundal albastru pentru primul tabel */
    table.center {
        background-color: blue;
    }
    #s1 {
        background-color: #00cc66;
    }
    #s2 {
        background-color: yellow;
    }
    div {
        color: blue;
    }
</style>
</head>
<body>

<h1 class="center">Tabele formatate</h1>
<div id="s1">
<table style="width:100%" class="center">
  <tr>
    <th>Firstname</th>
    <th>Lastname</th>
    <th>Age</th>
  </tr>
  <tr>
    <td>Jill</td>
    <td>Smith</td>
    <td>50</td>
  </tr>
  <tr>
    <td>Eve</td>
    <td>Jackson</td>
    <td>94</td>
  </tr>
</table>
<br>
</div> 
<div id="s2" style="width:50%">
<br>
<table style="width:100%" class="centre">
  <tr>
    <th class="centre">Firstname</th>
    <th class="centre">Lastname</th>
    <th class="centre">Age</th>
  </tr>
  <tr>
    <td class="centre">Jill</td>
    <td>Smith</td>
    <td>50</td>
  </tr>
  <tr>
    <td class="centre">Eve</td>
    <td>Jackson</td>
    <td>94</td>
  </tr>
</table>
</div> 

<!--
Explicatie Exercitiul 3:
1. Cele doua tabele au fundaluri diferite deoarece nu au un background-color 
propriu, asa ca prin ele se vede fundalul elementelor parinte:
 verde  de la div#s1 pentru primul tabel si galben  de la div#s2 
 pentru al doilea tabel.
2. In al doilea tabel, doar celulele din antet (th) si cele de pe prima coloana 
aveau clasa "centre" (care aplica border albastru de 5px si padding de 15px, 
suprascriind regula de tag table, th, td). Celelalte celule nu aveau clasa "centre", 
deci ramaneau cu chenar negru de 1px si fara padding.
-->
</body>
</html>
