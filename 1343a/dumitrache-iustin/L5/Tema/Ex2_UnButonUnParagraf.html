<!DOCTYPE html>
<html>
<head>
<title>Modificari cu JavaScript in tag</title>

</head>
<body>

<h1>Modificari paragraf la click pe buton</h1>

<p id="p1">Paragraf de modificat</p>

<button style="background-color: yellow; color: blue;"
    onclick="p1.style.backgroundColor = 'pink';
    p1.style.color='red';" >Click!</button>

</body>
</html>
