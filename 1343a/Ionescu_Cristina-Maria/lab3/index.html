<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<title>Laboratorul 3 – Stiluri CSS</title>
<style>
    
    ul {
        list-style-type: none; 
        padding: 0;
        margin: 20px 0;
    }

    li {
        display: inline-block; 
        margin-right: 10px;    
    }

    
    li a {
        display: block;
        padding: 10px 20px;
        color: white;          
        text-decoration: none; 
        border-radius: 8px;    
        font-family: Arial, sans-serif;
        font-weight: bold;
        transition: opacity 0.3s;
    }

    
    li:nth-child(1) a {
        background-color: #3498db; 
    }

    li:nth-child(2) a {
        background-color: #2ecc71; 
    }

    li:nth-child(3) a {
        background-color: #e74c3c; 
    }


    li a:hover {
        opacity: 0.85;
    }

    
    .link-simplu {
        margin-top: 20px;
    }
</style>
</head>
