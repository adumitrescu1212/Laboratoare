<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>Pagina 2</title>
    <style>
        /* Stil pentru secțiunea cu fundal galben și text albastru */
        .sectiune-galbena {
            background-color: yellow;
            color: blue;
            padding: 20px;
        }

        /* Stil pentru tabel și chenare */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            border: 1px solid blue;
            padding: 8px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="sectiune-galbena">
        <h2>Tabelul meu</h2>
        <!-- Un rând de antet (th) și două rânduri de date (td) -->
        <table>
            <thead>
                <tr>
                    <th>Nume</th>
                    <th>Prenume</th>
                    <th>Varsta</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Ionescu</td>
                    <td>Cristina-Maria</td>
                    <td>22</td>
                </tr>
                <tr>
                    <td>Stroescu</td>
                    <td>Adrian</td>
                    <td>23</td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- Link către prima pagină -->
    <p>
        <a href="pagina1.html">Înapoi la prima pagină</a>
    </p>

</body>
</html>
