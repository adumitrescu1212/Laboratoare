<!DOCTYPE html>
<html>
<head>
<title>Modificari paragrafe</title>
<script>
    function modificaParagrafe() {
        document.getElementById('p1').innerText = "Acesta este paragraful 1";
        document.getElementById('p2').innerText = "Acesta este paragraful 2";
        document.getElementById('p3').innerText = "Acesta este paragraful 3";

        document.getElementById('p1').style.color = "blue";
        document.getElementById('p1').style.backgroundColor = "red";

        document.getElementById('p2').style.color = "red";
        document.getElementById('p2').style.backgroundColor = "blue";

        document.getElementById('p3').style.color = "blue";
        document.getElementById('p3').style.backgroundColor = "yellow";
    }
</script>
</head>
<body>

<h1>Modificari paragrafe la click pe buton</h1>

<p id="p1">Acesta este paragraful 1</p>

<p id="p2">Acesta este paragraful 2</p>

<p id="p3">Acesta este paragraful 3</p>

<button type="button" onclick="modificaParagrafe()">Click me!</button>

</body>
</html>
