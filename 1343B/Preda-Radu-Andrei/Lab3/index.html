<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <title>Laborator 3 - Formatare Text CSS</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 30px;
      text-align: center;
    }

    ul.meniu-butoane {
      list-style-type: none;
      padding: 0;
      margin: 30px 0;
    }

    ul.meniu-butoane li {
      display: inline-block;
      margin: 0 10px;
    }

    ul.meniu-butoane li a {
      display: inline-block;
      padding: 12px 24px;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 14px;
      transition: opacity 0.2s;
    }
    ul.meniu-butoane li a:hover {
      opacity: 0.85;
    }
    .btn-ex2 {
      background-color: #2e7d32;
    }

    .btn-ex3 {
      background-color: #1565c0;
    }
    .btn-ex4 {
      background-color: #c62828;
    }
  </style>
</head>
<body>

  <h1>Laborator 3</h1>
  <p>Selectați un exercițiu pentru vizualizare:</p>
  <ul class="meniu-butoane">
    <li>
      <a class="btn-ex2" href="FormtareText_inline.html">Ex3</a>
    </li>
    <li>
      <a class="btn-ex3" href="FormtareText_internal.html">Ex2</a>
    </li>
    <li>
      <a class="btn-ex4" href="FormtareText_external.html">Ex4</a>
    </li>
  </ul>

</body>
</html>
